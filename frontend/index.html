<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoGarage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- オーバーレイ -->
<div class="drawer-overlay" id="drawerOverlay"></div>

<!-- ドロワー -->
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <span class="drawer-kicker">Library</span>
      <h2 class="drawer-title">VideoGarage</h2>
    </div>
    <button class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">×</button>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label">Playlists</div>
    <div id="tabList"></div>
    <button class="drawer-add-tab" id="addTabBtn">+ New playlist</button>
  </div>
  <!-- 認証セクション -->
  <div class="drawer-section">
    <div class="drawer-section-label">Account</div>
    <div id="authStatus" class="auth-status">Guest — saved on this device</div>
    <button class="drawer-add-tab" id="authBtn">Sign in</button>
  </div>
</aside>

<!-- プレイリスト操作メニュー -->
<div class="context-menu" id="contextMenu">
  <button id="ctxRenameBtn">Rename</button>
  <button id="ctxDeleteBtn" class="danger">Delete</button>
</div>

<!-- メインエリア -->
<div class="main">

  <header class="app-header">
    <div class="app-header-left">
      <button class="hamburger" id="hamburgerBtn" title="Menu" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <div class="brand-mark">VG</div>
      <div class="brand-copy">
        <div class="brand-name">VideoGarage</div>
        <div class="brand-sub">Your video library</div>
      </div>
    </div>
    <div class="header-meta">
      <span class="header-chip" id="videoCount">0 videos</span>
    </div>
  </header>

  <!-- 追加フォーム -->
  <div class="add-form-bar" id="addFormBar">
    <div class="input-panel">
      <label class="field-label" for="urlInput">Video URL</label>
      <div class="field-row">
        <input class="text-input url-input" id="urlInput" type="text" placeholder="https://youtube.com/watch?v=..." autocomplete="off" spellcheck="false" />
        <button class="btn-primary" id="addVideoBtn"><span>+</span> Add video</button>
      </div>
    </div>
  </div>

  <!-- コンテンツ -->
  <div class="content">
    <div class="content-header">
      <div>
        <span class="eyebrow">Playlist</span>
        <h1 id="playlistTitle">Videos</h1>
      </div>
      <div class="header-chip">Drag to reorder</div>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>

name: CI

on:
  pull_request:
    paths:
      - "infra/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.15.8

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraforminit

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false | tee plan.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan;
            try{
              plan = fs.readFileSync('infra/plan.txt', 'utf8');
            } catch {
              plan = 'planの実行に失敗しました。ジョブのログを確認してください。';
            }
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... (以下省略)'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n\n<details><summary>結果を表示</summary>\n\n\`\`\`\n${body}\n\`\`\`\n\n</details>`
            });
